<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carrossel — Nossas Memórias</title>
<style>
:root{
  --bg:#0f1724;
  --card:#0b1220;
  --accent:#ff6b81;
  --muted:#9aa4b2;
  --glass: rgba(255,255,255,0.04);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#071026 0%, #0b1630 100%);
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  font-size:16px;
  line-height:1.6;
  color:#e6eef6;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:24px;
}

/* ========================== Mensagem de amor ========================== */
#loveMessage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  font-size: 36px;
  font-weight: 800;
  color: #ff6b81;
  text-shadow: 0 0 20px rgba(255,107,129,0.5);
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  animation: none;
}

/* Fade-in e zoom inicial */
@keyframes fadeZoom {
  0% {opacity: 0; transform: translate(-50%, -50%) scale(0.6);}
  50% {opacity: 1; transform: translate(-50%, -50%) scale(1.05);}
  100% {opacity: 1; transform: translate(-50%, -50%) scale(1);}
}

/* Pulsação suave com glow */
@keyframes pulse {
  0%,100% { transform: translate(-50%, -50%) scale(1); text-shadow:0 0 15px rgba(255,107,129,0.5);}
  50% { transform: translate(-50%, -50%) scale(1.08); text-shadow:0 0 30px rgba(255,107,129,0.9);}
}

/* Float/fade-out */
@keyframes floatUp {
  0% {opacity: 1; transform: translate(-50%, -50%) scale(1); text-shadow:0 0 30px rgba(255,107,129,0.9);}
  100% {opacity: 0; transform: translate(-50%, -70%) scale(1.1); text-shadow:0 0 50px rgba(255,107,129,0);}
}

/* ========================== Carrossel ========================== */
.wrap{width:100%; max-width:920px;}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  border-radius:18px;
  padding:20px;
  box-shadow:0 12px 40px rgba(2,6,23,0.6);
  width:100%;
  overflow:hidden;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.title{
  font-size:20px;
  font-weight:700;
  line-height:1.3;
  display:flex;
  gap:10px;
  align-items:center;
}
.subtitle{
  font-size:14px;
  color:#cfd6e0;
}

.carousel{
  position: relative;
  overflow:hidden;
  border-radius:16px;
  background:var(--card);
  width:100%;
}
.slides{
  display:flex;
  transition: transform 0.5s ease;
}
.slide{
  flex:0 0 100%;
  display:flex;
  gap:20px;
  align-items:center;
  padding:20px;
  box-sizing:border-box;
  min-height:280px;
}
.media{
  border-radius:10px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}
.media img{
  border-radius:10px;
}
.content{
  flex:1;
}
.month{
  font-size:24px;
  font-weight:700;
  margin-bottom:8px;
  color:#ffffff;
}
.desc{
  font-size:16px;
  line-height:1.6;
  color:#d0d8e0;
}

.controls{
  position:absolute;
  left:8px;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
button.ctrl{
  pointer-events:auto;
  background:var(--glass);
  border:0;
  padding:10px;
  border-radius:999px;
  backdrop-filter: blur(6px);
  cursor:pointer;
  color:#fff;
  font-size:18px;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
button.ctrl:active{transform:scale(.95)}

.indicators{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:14px;
}
.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  cursor:pointer;
  transition: all 0.3s;
}
.dot.active{
  background:var(--accent);
  box-shadow:0 0 12px rgba(255,107,129,0.3);
  transform: scale(1.2);
}

footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}
.timer{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
.btn{
  background:transparent;
  border:1px solid rgba(255,255,255,0.06);
  padding:8px 12px;
  border-radius:10px;
  color:#e6eef6;
  cursor:pointer;
  transition: all 0.3s;
}
.btn:hover{background:rgba(255,255,255,0.05);}
.btn.primary{background:var(--accent);border-color:transparent}

/* Desktop: imagens quadradas grandes */
@media(min-width:761px){
  .slide{
    flex-direction:row;
    padding:32px;
  }
  .media{
    flex:0 0 45%;
    width:45%;
    aspect-ratio:1/1; /* quadrado */
  }
  .media img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .content{
    flex:1;
    margin-left:20px;
  }
}

/* Mobile: manter layout antigo */
@media(max-width:760px){
  .slide{
    flex-direction:column;
    padding:18px;
  }
  .media{
    width:100%;
    height:200px;
    margin-bottom:12px;
    aspect-ratio:auto;
  }
  .media img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .content{
    width:100%;
    margin-left:0;
  }
}
</style>
</head>
<body>

<div id="loveMessage">Eu te amo, preta ❤️</div>

<div class="wrap">
  <div style="text-align:center; margin-bottom:12px;">
    <audio controls autoplay loop>
      <source src="chuva.mp3" type="audio/mpeg">
      Seu navegador não suporta o elemento de áudio.
    </audio>
  </div>
  <div class="card">
    <header>
      <div>
        <div class="title">🎉 Nosso Carrossel — Memórias</div>
        <div class="subtitle">Passe os slides para relembrar momentos especiais</div>
      </div>
      <div class="subtitle">memórias ❤️</div>
    </header>

    <div class="carousel" id="carousel">
      <div class="controls">
        <button class="ctrl" id="prev">❮</button>
        <button class="ctrl" id="next">❯</button>
      </div>
      <div class="slides" id="slides"></div>
    </div>
    <div class="indicators" id="indicators"></div>

    <footer>
      <div class="timer" id="timer">Autoplay: ligado — alterna a cada 4s</div>
      <div class="actions">
        <button class="btn" id="togglePlay">Pausar</button>
      </div>
    </footer>
  </div>
</div>



<script>
// ========================== Dados ==========================
const imagens = [
  "./1.jpg","./2.jpg","./o primeiro cineminha juntoos.jpg","./jantarzinho.jpg",
  "./heroi.jpg","./bebemos-jintos.jpg","./insanos.jpg","./4.jpg",
  "./IMG-20250720-WA0023(2).jpg","./luanzinho.jpg","./natalzinhoo.jpg",
  "./ano-novo.jpg","./ano-novopt2.jpg","./IMG-20250814-WA0498.jpg"
];
const captions = [
  {title:"Primeira ida em casinha💖", text:"O dia em que você conheceu minha família!"},
  {title:"Cabelo novo 🌸", text:"Quando cortei o cabelo pra te impressionar 😉"},
  {title:"Primeiro cineminha 🌞", text:"Nosso primeiro cineminha juntos!"},
  {title:"Jantar romântico 🌹", text:"Nosso primeiro jantar a dois."},
  {title:"Seu herói 💕", text:"Eu quero ser seu herói, sempre vou te proteger, quero ser seu capitão do amor."},
  {title:"Chapamos o globo 🎶", text:"Aquele dia divertido que rimos muito juntos no aniversário da Mary."},
  {title:"Lanchinhoooo 🥪", text:"Nosso primeiro insanos juntos."},
  {title:"Filme juntos 🍀", text:"Nosso primeiro filme juntinhos."},
  {title:"Arrumados para o show", text:"Arrumadinhos pra ver nosso ídolo."},
  {title:"Luanzinho", text:"O dia que vimos o Luan Santana no palco."},
  {title:"Natalzinho 💖", text:"Continuando nossa linda história."},
  {title:"Primeiro aninho novo", text:"Nosso aninho novo, que foi magnífico — precisamos viajar juntos."},
  {title:"Ano novo parte 2", text:"Parte 2 desse dia maravilhoso, na piscininha juntinhos 💗😍💓💞"},
  {title:"Casamento da Duda", text:"A gente feliz e se divertindo no casamento da Duda."}
];
const colors = ["#1f2a3b","#273447","#2f3e52","#37485d","#3f5168","#475b73","#4f647e","#576f89","#60879c","#6890a7","#70a0b2","#78a9bd","#80b2c8"];

// ========================== Carrossel ==========================
const slidesEl = document.getElementById('slides');
const indicatorsEl = document.getElementById('indicators');
let current=0;

function makeSlide(idx){
  const s=document.createElement('div'); s.className='slide'; s.style.background=colors[idx%colors.length];
  const media=document.createElement('div'); media.className='media'; media.innerHTML=`<img src="${imagens[idx]}" alt="Memória ${idx+1}">`;
  const content=document.createElement('div'); content.className='content'; content.innerHTML=`<div class="month">${captions[idx].title}</div><div class="desc">${captions[idx].text}</div>`;
  s.appendChild(media); s.appendChild(content); slidesEl.appendChild(s);
  const dot=document.createElement('div'); dot.className='dot'; dot.addEventListener('click',()=>goTo(idx)); indicatorsEl.appendChild(dot);
}
for(let i=0;i<imagens.length;i++) makeSlide(i);

function update(){ slidesEl.style.transform=`translateX(${-current*100}%)`; document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));}
function prev(){current=(current-1+imagens.length)%imagens.length; update();}
function next(){current=(current+1)%imagens.length; update();}
function goTo(i){current=i; update();}
document.getElementById('prev').addEventListener('click',()=>{prev(); resetAutoplay();});
document.getElementById('next').addEventListener('click',()=>{next(); resetAutoplay();});

let autoplay=true, intervalId=null, delay=8000;
const timerEl=document.getElementById('timer');
const togglePlayBtn=document.getElementById('togglePlay');
function startAutoplay(){clearInterval(intervalId);intervalId=setInterval(next,delay);timerEl.textContent=`Autoplay: ligado — alterna a cada ${delay/1000}s`;togglePlayBtn.textContent='Pausar';autoplay=true;}
function stopAutoplay(){clearInterval(intervalId);intervalId=null;timerEl.textContent='Autoplay: pausado';togglePlayBtn.textContent='Reproduzir';autoplay=false;}
function resetAutoplay(){if(autoplay){stopAutoplay();startAutoplay();}}
togglePlayBtn.addEventListener('click',()=>autoplay?stopAutoplay():startAutoplay());

// Swipe
let startX=0, deltaX=0, isTouch=false;
slidesEl.addEventListener('pointerdown',e=>{isTouch=true;startX=e.clientX;slidesEl.style.transition='none';});
window.addEventListener('pointermove',e=>{if(!isTouch) return; deltaX=e.clientX-startX; slidesEl.style.transform=`translateX(${-current*100 + (deltaX/slidesEl.clientWidth)*100}%)`;});
window.addEventListener('pointerup',()=>{if(!isTouch)return; isTouch=false; slidesEl.style.transition=''; if(Math.abs(deltaX)>60){deltaX<0?next():prev();} else update(); deltaX=0; resetAutoplay();});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev(); if(e.key==='ArrowRight')next();});

// Inicializa
update(); startAutoplay();

// ========================== Mensagem Eu te amo ==========================
window.addEventListener('load', () => {
  const loveMsg = document.getElementById('loveMessage');
  loveMsg.style.animation = 'fadeZoom 1s forwards';
  setTimeout(()=>{loveMsg.style.animation = 'pulse 2.5s ease-in-out infinite';},2000);
  setTimeout(()=>{loveMsg.style.animation = 'floatUp 1s forwards';},3500);
});
</script>
</body>
</html>
